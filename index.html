<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>내 웹앱</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0f172a; color: #f8fafc;
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; font-size: 17px;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }
    h1 { font-size: 24px; margin: 4px 4px 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; max-width: 1100px; }
    a.app {
      display: flex; gap: 14px; align-items: center; padding: 14px; min-height: 84px;
      background: #1e1b4b; border-radius: 18px; color: inherit; text-decoration: none;
    }
    a.app:active { transform: scale(0.98); }
    a.app img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
    .name { font-weight: 700; font-size: 18px; }
    .desc { color: #a5b4fc; font-size: 14px; margin-top: 2px; }
    .empty { color: #a5b4fc; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>내 웹앱</h1>
  <div class="grid" id="list"></div>
  <script>
    fetch('./apps.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((apps) => {
        const list = document.getElementById('list');
        if (!apps.length) {
          list.innerHTML = '<p class="empty">아직 앱이 없어요.<br>Claude 앱 Code 탭에서 이 저장소를 고르고 "○○ 앱 만들어줘"라고 말해보세요.</p>';
          return;
        }
        for (const a of apps) {
          const el = document.createElement('a');
          el.className = 'app';
          el.href = `./${a.id}/`;
          el.innerHTML = `<img alt="" src="./${a.id}/icon-192.png"><div><div class="name"></div><div class="desc"></div></div>`;
          el.querySelector('.name').textContent = a.name;
          el.querySelector('.desc').textContent = a.description || '';
          list.append(el);
        }
      });
  </script>
</body>
</html>

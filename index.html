<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b4b">
  <title>새 웹앱</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg: #0f172a; --card: #1e1b4b; --text: #f8fafc; --muted: #a5b4fc; --accent: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; font-size: 17px;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: var(--card); border-radius: 20px; padding: 24px; width: min(480px, 100%);
      text-align: center; line-height: 1.6;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 8px 0; color: var(--muted); }
    button {
      min-height: 52px; padding: 0 24px; border: 0; border-radius: 14px; font-size: 18px; font-weight: 700;
      background: var(--accent); color: #1e1b4b; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .count { font-size: 56px; font-weight: 800; margin: 8px 0; }
    .meta { font-size: 13px; color: var(--muted); opacity: 0.7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="app-name">새 웹앱</h1>
    <p>이 화면은 템플릿입니다.<br>Claude 앱 Code 탭에서 만들고 싶은 앱을 말해보세요.</p>
    <div class="count" id="count">0</div>
    <button id="tap">눌러보기</button>
  </div>
  <button id="install" hidden>📲 홈 화면에 설치</button>
  <div class="meta"><span id="version"></span> · <span id="net"></span></div>

  <script>
    const APP_NAME = '새 웹앱';
    const APP_VERSION = '0.1.1';
    const STORE_KEY = 'new-app:v1';

    // ── 순수 로직 (DOM 없이 테스트 가능하게 여기에 둔다) ──
    function nextCount(n) {
      return (Number.isFinite(n) ? n : 0) + 1;
    }

    function loadState(raw) {
      try {
        const s = JSON.parse(raw);
        return { count: Number.isFinite(s?.count) ? s.count : 0 };
      } catch {
        return { count: 0 };
      }
    }

    // ── 화면 ──
    if (typeof document !== 'undefined') main();

    function main() {
      const $ = (id) => document.getElementById(id);
      document.title = APP_NAME;
      $('app-name').textContent = APP_NAME;
      $('version').textContent = 'v' + APP_VERSION;

      let state = loadState(localStorage.getItem(STORE_KEY));
      const render = () => { $('count').textContent = state.count; };
      render();
      $('tap').addEventListener('click', () => {
        state.count = nextCount(state.count);
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        render();
      });

      const net = () => { $('net').textContent = navigator.onLine ? '온라인' : '오프라인'; };
      addEventListener('online', net); addEventListener('offline', net); net();

      // 설치 버튼 (Chrome/삼성 인터넷)
      let deferred = null;
      addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('install').hidden = false; });
      $('install').addEventListener('click', async () => {
        if (!deferred) return;
        deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true;
      });

      // 서비스 워커: 새 버전이 활성화되면 한 번 새로고침
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded || !navigator.serviceWorker.controller) return;
          reloaded = true; location.reload();
        });
      }
    }
  </script>
</body>
</html>

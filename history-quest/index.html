<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7c86">
  <title>역사 퀘스트</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg: #eef8f9; --panel: #ffffff; --text: #16323a; --muted: #5b7a82; --line: #d5e9ec;
      --pri: #0e9aa7; --pri-d: #0e7c86; --acc: #ff7a59; --yel: #ffd166; --ok: #22a06b; --bad: #e5484d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; font-size: 17px; line-height: 1.5;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    main { width: min(640px, 100%); margin: 0 auto; }
    section { display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 6px 0 0; font-size: 30px; letter-spacing: -0.5px; }
    h2 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); margin: 0; }
    .panel { background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: 0 2px 10px rgba(14,124,134,.08); }
    button {
      font: inherit; min-height: 52px; padding: 0 18px; border: 0; border-radius: 14px; font-weight: 700;
      background: var(--pri); color: #fff; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    button.ghost { background: #e3f3f5; color: var(--pri-d); }
    button.small { min-height: 44px; font-size: 15px; padding: 0 14px; }
    .top { display: flex; align-items: center; gap: 10px; }
    .top h2 { flex: 1; }
    .back { min-width: 48px; padding: 0 12px; background: #e3f3f5; color: var(--pri-d); font-size: 20px; }

    /* 홈 */
    .hero { background: linear-gradient(135deg, #0e9aa7, #0b6f8a); color: #fff; border-radius: 24px; padding: 20px; }
    .hero .sub { color: #cdeff3; }
    .bar { height: 12px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; margin-top: 12px; }
    .bar > i { display: block; height: 100%; background: var(--yel); border-radius: 99px; width: 0; transition: width .4s; }
    .stats { display: flex; gap: 14px; margin-top: 8px; font-size: 15px; color: #e6fbfd; flex-wrap: wrap; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mode { min-height: 112px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
            text-align: left; gap: 2px; padding: 14px 16px; border-radius: 20px; background: var(--panel); color: var(--text);
            box-shadow: 0 2px 10px rgba(14,124,134,.08); }
    .mode b { font-size: 19px; }
    .mode span { font-weight: 400; font-size: 14px; color: var(--muted); }
    .mode .em { font-size: 30px; line-height: 1; }
    .range { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .range p { margin: 0; font-size: 15px; color: var(--muted); }
    .range button { white-space: nowrap; flex-shrink: 0; }

    /* 범위 선택 */
    .group h3 { margin: 6px 0 8px; font-size: 16px; color: var(--pri-d); display: flex; justify-content: space-between; align-items: center; }
    .group h3 button { min-height: 36px; font-size: 13px; padding: 0 10px; }
    .chip { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; margin: 6px 0; text-align: left;
            background: #f4fafb; color: var(--text); border: 2px solid var(--line); font-weight: 600; font-size: 15px; padding: 6px 12px; }
    .chip.on { border-color: var(--pri); background: #e0f5f7; }
    .chip .no { min-width: 34px; height: 34px; border-radius: 10px; background: #cfe9ec; color: var(--pri-d); display: grid; place-items: center; font-size: 15px; }
    .chip.on .no { background: var(--pri); color: #fff; }
    .chip .nm { flex: 1; }
    .chip .pc { font-size: 13px; color: var(--muted); font-weight: 400; }

    /* 플래시카드 */
    .meta-row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 15px; gap: 8px; }
    .flip { perspective: 1200px; min-height: 340px; cursor: pointer; }
    .flip-in { position: relative; width: 100%; min-height: 340px; transition: transform .45s; transform-style: preserve-3d; }
    .flip.turned .flip-in { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px;
            padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; background: var(--panel);
            box-shadow: 0 6px 20px rgba(14,124,134,.14); overflow: auto; }
    .face.back { transform: rotateY(180deg); background: #fffaf0; }
    .tag { align-self: flex-start; background: #e0f5f7; color: var(--pri-d); font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
    .q { font-size: 22px; font-weight: 700; line-height: 1.5; flex: 1; display: flex; align-items: center; word-break: keep-all; }
    .ans { font-size: 30px; font-weight: 800; color: var(--acc); word-break: keep-all; }
    .ex { font-size: 17px; color: var(--text); word-break: keep-all; }
    .hint { color: var(--pri-d); font-weight: 700; font-size: 20px; letter-spacing: 2px; min-height: 30px; }
    .tap { color: var(--muted); font-size: 14px; text-align: center; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .no-btn { background: #ffe9e4; color: #c2410c; }
    .yes-btn { background: #dcf5e8; color: #157347; }
    .done { text-align: center; padding: 26px 16px; }
    .done .big { font-size: 56px; }

    /* 퀴즈 */
    .qhead { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .combo { color: var(--acc); }
    .qbox { font-size: 20px; font-weight: 700; word-break: keep-all; line-height: 1.55; }
    .opts { display: flex; flex-direction: column; gap: 10px; }
    .opt { text-align: left; background: var(--panel); color: var(--text); border: 2px solid var(--line); font-weight: 600;
           padding: 12px 16px; min-height: 58px; line-height: 1.4; word-break: keep-all; }
    .opt.right { border-color: var(--ok); background: #dcf5e8; }
    .opt.wrong { border-color: var(--bad); background: #ffe4e4; }
    .opt:disabled { opacity: 1; }
    .feedback { border-radius: 16px; padding: 14px; font-size: 16px; word-break: keep-all; }
    .feedback.ok { background: #dcf5e8; }
    .feedback.ng { background: #ffe9e4; }
    .pbar { height: 8px; background: #d5e9ec; border-radius: 99px; overflow: hidden; }
    .pbar > i { display: block; height: 100%; background: var(--pri); width: 0; transition: width .3s; }
    .result { text-align: center; }
    .result .score { font-size: 56px; font-weight: 800; color: var(--pri-d); margin: 4px 0; }
    .stars { font-size: 40px; letter-spacing: 6px; }
    .wl { text-align: left; margin: 10px 0 0; padding: 0; list-style: none; }
    .wl li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; word-break: keep-all; }
    .wl b { color: var(--acc); }

    /* 연표 */
    .ev { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); color: var(--text);
          border: 2px solid var(--line); min-height: 64px; padding: 10px 14px; font-weight: 600; word-break: keep-all; }
    .ev .n { min-width: 36px; height: 36px; border-radius: 50%; background: #e3f3f5; color: var(--pri-d); display: grid; place-items: center; font-weight: 800; }
    .ev.picked { border-color: var(--pri); background: #e0f5f7; }
    .ev.picked .n { background: var(--pri); color: #fff; }
    .ev.bad { animation: shake .35s; border-color: var(--bad); }
    .ev .yr { margin-left: auto; color: var(--acc); font-weight: 800; white-space: nowrap; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; }
    [hidden] { display: none !important; }
    @media (min-width: 800px) { .flip, .flip-in { min-height: 380px; } .q { font-size: 24px; } }
  </style>
</head>
<body>
<main>
  <!-- 홈 -->
  <section id="home">
    <div class="hero">
      <h1>📜 역사 퀘스트</h1>
      <p class="sub">중2 역사 · 기말고사 대비 (주제 19~40)</p>
      <div class="bar"><i id="totalBar"></i></div>
      <div class="stats"><span id="totalPct">마스터 0%</span><span id="wrongCnt">오답 0개</span><span id="bestScore">최고점 0</span></div>
    </div>
    <div class="panel range">
      <p id="rangeText">시험 범위 전체</p>
      <button class="small ghost" id="goTopics">📚 범위 고르기</button>
    </div>
    <div class="modes">
      <button class="mode" data-go="flash"><span class="em">🃏</span><b>플래시카드</b><span>뒤집어 보며 외우기</span></button>
      <button class="mode" data-go="quiz"><span class="em">⚡</span><b>퀴즈 배틀</b><span>10문제 4지선다</span></button>
      <button class="mode" data-go="timeline"><span class="em">⏳</span><b>연표 순서</b><span>먼저 일어난 순서대로</span></button>
      <button class="mode" data-go="wrong"><span class="em">📝</span><b>오답 노트</b><span>틀린 것만 다시</span></button>
    </div>
    <div class="panel">
      <div class="toggle"><span>🔊 효과음</span><button class="small ghost" id="soundBtn">켜짐</button></div>
      <div class="toggle"><span>🔄 플래시카드 앞면</span><button class="small ghost" id="swapBtn">설명 → 용어</button></div>
    </div>
    <p class="foot">주하 화이팅 💪 · <span id="version"></span></p>
  </section>

  <!-- 범위 선택 -->
  <section id="topics" hidden>
    <div class="top"><button class="back" data-back>←</button><h2>시험 범위 고르기</h2></div>
    <div class="row"><button class="small ghost" id="selAll">전체 선택</button><button class="small ghost" id="selNone">전체 해제</button></div>
    <div id="topicList"></div>
    <button id="topicsDone">완료</button>
  </section>

  <!-- 플래시카드 -->
  <section id="flash" hidden>
    <div class="top"><button class="back" data-back>←</button><h2 id="flashTitle">플래시카드</h2></div>
    <div id="flashPlay">
      <div class="meta-row"><span id="flashCount">1 / 10</span><span id="flashLeft"></span></div>
      <div class="pbar" style="margin:8px 0 12px"><i id="flashBar"></i></div>
      <div class="flip" id="flipCard">
        <div class="flip-in">
          <div class="face front">
            <span class="tag" id="fTag"></span>
            <div class="q" id="fFront"></div>
            <div class="hint" id="fHint"></div>
            <div class="tap">👆 카드를 누르면 뒤집혀요</div>
          </div>
          <div class="face back">
            <span class="tag" id="bTag"></span>
            <div class="ans" id="bMain"></div>
            <div class="ex" id="bSub"></div>
            <div class="ex" id="bEx" style="color:var(--muted)"></div>
          </div>
        </div>
      </div>
      <div class="two" style="margin-top:14px">
        <button class="ghost" id="hintBtn">💡 초성 힌트</button>
        <button class="ghost" id="flipBtn">🔄 뒤집기</button>
      </div>
      <div class="two" style="margin-top:10px">
        <button class="no-btn" id="noBtn">😵 몰라요</button>
        <button class="yes-btn" id="yesBtn">😎 알아요</button>
      </div>
    </div>
    <div class="panel done" id="flashDone" hidden>
      <div class="big">🎉</div>
      <h2>한 바퀴 끝!</h2>
      <p class="sub" id="flashDoneText"></p>
      <div class="row" style="margin-top:14px"><button id="flashAgain">다시 하기</button><button class="ghost" data-back>홈으로</button></div>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" hidden>
    <div class="top"><button class="back" data-back>←</button><h2>⚡ 퀴즈 배틀</h2></div>
    <div id="quizPlay">
      <div class="qhead"><span id="qNum">1 / 10</span><span class="combo" id="qCombo"></span><span id="qScore">0점</span></div>
      <div class="pbar" style="margin-top:8px"><i id="qBar"></i></div>
      <div class="panel" style="margin-top:12px">
        <span class="tag" id="qTag"></span>
        <div class="qbox" id="qText" style="margin-top:10px"></div>
      </div>
      <div class="opts" id="qOpts" style="margin-top:12px"></div>
      <div class="feedback" id="qFb" hidden style="margin-top:12px"></div>
      <button id="qNext" hidden style="margin-top:12px; width:100%">다음 ▶</button>
    </div>
    <div class="panel result" id="quizDone" hidden>
      <div class="stars" id="rStars"></div>
      <div class="score" id="rScore"></div>
      <p class="sub" id="rText"></p>
      <ul class="wl" id="rWrong"></ul>
      <div class="row" style="margin-top:14px"><button id="quizAgain">한 판 더!</button><button class="ghost" data-back>홈으로</button></div>
    </div>
  </section>

  <!-- 연표 -->
  <section id="timeline" hidden>
    <div class="top"><button class="back" data-back>←</button><h2>⏳ 연표 순서</h2></div>
    <div id="tlPlay">
      <div class="qhead"><span id="tlNum">1 / 5</span><span id="tlScore">0점</span></div>
      <p class="sub">먼저 일어난 사건부터 차례로 눌러요!</p>
      <div class="opts" id="tlList"></div>
      <div class="feedback" id="tlFb" hidden></div>
      <button id="tlNext" hidden style="width:100%">다음 ▶</button>
    </div>
    <div class="panel result" id="tlDone" hidden>
      <div class="stars" id="tlStars"></div>
      <div class="score" id="tlFinal"></div>
      <p class="sub">완벽하게 맞힌 라운드 수</p>
      <div class="row" style="margin-top:14px"><button id="tlAgain">한 판 더!</button><button class="ghost" data-back>홈으로</button></div>
    </div>
  </section>
</main>
<button id="install" hidden style="position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom))">📲 설치</button>

<script>
const APP_NAME = '역사 퀘스트';
const APP_VERSION = '1.0.0';
const STORE_KEY = 'history-quest:v1';

// ── 단원 (해냄에듀 중학교 역사 교과서 주제 번호) ──
const TOPICS = {
  19: '명·청의 발전과 동아시아 질서', 20: '명·청의 경제와 사회·문화', 21: '에도 막부의 성장',
  22: '인도에서 발전한 무굴 제국', 23: '이슬람 왕조와 오스만 제국', 24: '유럽의 종교 개혁',
  27: '재정·군사 국가(절대 왕정)', 28: '미국 혁명과 민주 공화국', 29: '프랑스 혁명의 발발과 전파',
  30: '빈 체제와 1848년 혁명', 31: '새롭게 등장한 국민 국가', 32: '미국의 성장과 라틴 아메리카',
  33: '산업화와 사회 변화', 34: '서양 열강의 제국주의', 37: '동아시아 3국의 개항',
  38: '동아시아의 근대화와 민족 운동', 39: '일본의 대외 침략과 신해혁명', 40: '제1차 세계 대전과 이후의 세계',
};
const GROUPS = [
  ['동아시아·인도·이슬람 세계', [19, 20, 21, 22, 23]],
  ['유럽 세계의 변화', [24, 27]],
  ['시민 혁명', [28, 29, 30]],
  ['국민 국가와 산업화·제국주의', [31, 32, 33, 34]],
  ['동아시아의 근대', [37, 38, 39]],
  ['제1차 세계 대전', [40]],
];

// [주제, 용어(정답), 설명(문제), 덧붙임]
const CARDS = [
  // 19 명·청의 발전과 동아시아 지역 질서
  [19, '주원장(홍무제)', '홍건적 출신으로 원을 몰아내고 명을 세운 황제(1368)', '한족 왕조를 다시 세움. 처음 수도는 난징'],
  [19, '화이사상', '한족 국가를 천하의 중심(중화)으로, 주변 민족을 오랑캐로 여긴 생각', '명은 이를 바탕으로 조공·책봉 질서를 세움'],
  [19, '육유', '홍무제가 백성에게 반포한 6가지 유교 가르침(부모께 효도, 웃어른 공경 등)', '유교 윤리를 백성에게 널리 보급'],
  [19, '이갑제', '홍무제가 110호를 1리로 묶어 세금 징수와 치안을 맡긴 농촌 조직', ''],
  [19, '영락제', '수도를 베이징으로 옮기고 자금성을 지었으며 정화의 항해를 지원한 명의 황제', '몽골 원정도 함. 조카를 몰아내고 즉위'],
  [19, '정화의 항해', '영락제의 명령으로 대함대를 이끌고 동남아시아·인도양·아프리카 동해안까지 간 원정', '조공국을 늘리려는 목적, 7차례 항해'],
  [19, '해금 정책', '명이 민간인의 해외 무역을 금지하고 조공 무역만 허용한 정책', ''],
  [19, '조공·책봉 관계', '주변국이 중국에 조공을 바치고, 중국 황제는 그 나라 왕을 인정(책봉)해 준 외교 관계', '명·청 시대 동아시아 국제 질서의 핵심'],
  [19, '북로남왜', '명을 괴롭힌 북쪽의 몽골과 남쪽 해안의 왜구를 함께 이르는 말', '임진왜란 참전까지 겹쳐 명의 재정 악화'],
  [19, '이자성의 난', '명 말기 농민 반란군이 베이징을 점령해 명을 멸망시킨 사건(1644)', '이후 청이 베이징에 들어옴'],
  [19, '누르하치', '여진(만주족)을 통합하여 후금을 세운 인물(1616)', '아들 홍타이지가 나라 이름을 청으로 바꿈'],

// ── 순수 로직 (DOM 없이 테스트 가능) ──
const ALL_TOPICS = Object.keys(TOPICS).map(Number);
const cardId = (c) => c[0] + '|' + c[1];

const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function chosung(str) {
  let out = '';
  for (const ch of String(str)) {
    const c = ch.charCodeAt(0);
    out += (c >= 0xac00 && c <= 0xd7a3) ? CHO[Math.floor((c - 0xac00) / 588)] : ch;
  }
  return out;
}

function shuffle(arr, rnd = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function cardsFor(topics) {
  const set = new Set(topics);
  return CARDS.filter((c) => set.has(c[0]));
}
function eventsFor(topics) {
  const set = new Set(topics);
  return EVENTS.filter((e) => set.has(e[0]));
}

// 오답 보기: 같은 주제 우선, 부족하면 다른 주제에서
function pickDistractors(card, pool, n, rnd = Math.random, key = 1) {
  const same = shuffle(pool.filter((c) => c[0] === card[0] && c[1] !== card[1]), rnd);
  const other = shuffle(CARDS.filter((c) => c[0] !== card[0]), rnd);
  const out = [];
  const seen = new Set([card[key]]);
  for (const c of [...same, ...other]) {
    if (out.length >= n) break;
    if (seen.has(c[key])) continue;
    seen.add(c[key]); out.push(c);
  }
  return out;
}

// 연도가 겹치지 않는 사건 k개 고르기
function pickEvents(pool, k, rnd = Math.random) {
  const src = pool.length >= k ? pool : EVENTS;
  const years = new Set();
  const out = [];
  for (const e of shuffle(src, rnd)) {
    const y = Math.floor(e[1]);
    if (years.has(y)) continue;
    years.add(y); out.push(e);
    if (out.length === k) return out;
  }
  if (src !== EVENTS) return pickEvents(EVENTS, k, rnd);
  return out;
}

// 문제 만들기. type: 'term'(설명→용어), 'desc'(용어→설명), 'first'(가장 먼저 일어난 일)
function makeQuestion(card, pool, evPool, type, rnd = Math.random) {
  if (type === 'first') {
    const evs = pickEvents(evPool, 4, rnd);
    const answer = evs.reduce((a, b) => (b[1] < a[1] ? b : a));
    return {
      type, topic: answer[0], text: '다음 중 가장 먼저 일어난 일은?',
      options: evs.map((e) => e[3]), answer: answer[3],
      explain: evs.slice().sort((a, b) => a[1] - b[1]).map((e) => `${e[2]} ${e[3]}`).join(' → '),
      id: null,
    };
  }
  if (type === 'desc') {
    const ds = pickDistractors(card, pool, 3, rnd, 2);
    return {
      type, topic: card[0], text: `'${card[1]}'에 대한 설명으로 옳은 것은?`,
      options: shuffle([card[2], ...ds.map((c) => c[2])], rnd), answer: card[2],
      explain: card[3] ? `${card[1]} — ${card[3]}` : card[1], id: cardId(card),
    };
  }
  const ds = pickDistractors(card, pool, 3, rnd, 1);
  return {
    type: 'term', topic: card[0], text: card[2],
    options: shuffle([card[1], ...ds.map((c) => c[1])], rnd), answer: card[1],
    explain: card[3] ? `${card[1]} — ${card[3]}` : card[1], id: cardId(card),
  };
}

// 퀴즈 한 판: 약한 카드(레벨 낮은 것)를 우선 출제
function makeQuiz(topics, levels, n = 10, rnd = Math.random) {
  const pool = cardsFor(topics.length ? topics : ALL_TOPICS);
  const evPool = eventsFor(topics.length ? topics : ALL_TOPICS);
  const ordered = shuffle(pool, rnd).sort((a, b) => (levels[cardId(a)] || 0) - (levels[cardId(b)] || 0));
  const picks = ordered.slice(0, Math.min(n, pool.length));
  const qs = picks.map((c, i) => {
    const r = rnd();
    const type = (i % 5 === 4) ? 'first' : (r < 0.2 ? 'desc' : 'term');
    return makeQuestion(c, pool, evPool, type, rnd);
  });
  return shuffle(qs, rnd);
}

function scoreFor(combo) { return 10 + Math.min(combo, 5) * 2; }

function starsFor(correct, total) {
  const r = total ? correct / total : 0;
  return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0;
}

// 숙련도: 0(모름) ~ 3. 2 이상이면 '마스터'
function bumpLevel(levels, id, ok) {
  const next = { ...levels };
  next[id] = ok ? Math.min((next[id] || 0) + 1, 3) : 0;
  return next;
}
function masteryOf(cards, levels) {
  if (!cards.length) return 0;
  const m = cards.filter((c) => (levels[cardId(c)] || 0) >= 2).length;
  return Math.round((m / cards.length) * 100);
}

// 플래시카드 덱: '몰라요'는 3장 뒤에 다시 나오게
function requeue(deck, pos, gap = 3) {
  const d = deck.slice();
  const [card] = d.splice(pos, 1);
  d.splice(Math.min(pos + gap, d.length), 0, card);
  return d;
}

function isSorted(events) {
  for (let i = 1; i < events.length; i++) if (events[i - 1][1] > events[i][1]) return false;
  return true;
}

function loadState(raw) {
  const def = { lv: {}, wrong: [], sel: ALL_TOPICS.slice(), best: 0, swap: false, sound: true };
  try {
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return def;
    const valid = new Set(CARDS.map(cardId));
    const lv = {};
    for (const [k, v] of Object.entries(s.lv || {})) if (valid.has(k) && Number.isFinite(v)) lv[k] = Math.max(0, Math.min(3, v));
    return {
      lv,
      wrong: Array.isArray(s.wrong) ? s.wrong.filter((k) => valid.has(k)) : [],
      sel: Array.isArray(s.sel) ? s.sel.filter((t) => TOPICS[t]) : def.sel,
      best: Number.isFinite(s.best) ? s.best : 0,
      swap: !!s.swap,
      sound: s.sound !== false,
    };
  } catch {
    return def;
  }
}

  let state = loadState(localStorage.getItem(STORE_KEY));
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} };
  const sel = () => (state.sel.length ? state.sel : ALL_TOPICS);
  const byId = new Map(CARDS.map((c) => [cardId(c), c]));
  const markWrong = (id) => { if (id && !state.wrong.includes(id)) state.wrong.push(id); };
  const unmarkWrong = (id) => { state.wrong = state.wrong.filter((x) => x !== id); };

  // 효과음
  let ac = null;
  function beep(kind) {
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const notes = kind === 'ok' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1047] : [220, 180];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = kind === 'ng' ? 'sawtooth' : 'triangle';
        o.frequency.value = f;
        const t = ac.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.2);
      });
    } catch {}
  }

  // 화면 전환
  const screens = ['home', 'topics', 'flash', 'quiz', 'timeline'];
  function show(name) {
    for (const s of screens) $(s).hidden = s !== name;
    scrollTo(0, 0);
    if (name === 'home') renderHome();
  }
  document.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', () => { save(); show('home'); }));

  // 홈
  function renderHome() {

    $('wrongCnt').textContent = `📝 오답 ${state.wrong.length}개`;
    $('bestScore').textContent = `⭐ 최고점 ${state.best}`;
    const s = sel();

  $('swapBtn').addEventListener('click', () => { state.swap = !state.swap; save(); renderHome(); });

    if (go === 'flash') startFlash(false);
    else if (go === 'wrong') startFlash(true);

  // 범위 선택
  $('goTopics').addEventListener('click', () => { renderTopics(); show('topics'); });

  // ── 플래시카드 ──
  let deck = [], pos = 0, flashWrongMode = false, known = 0, total = 0;
  function startFlash(wrongMode) {
    flashWrongMode = wrongMode;

      b.className = 'opt';
      b.textContent = `${'①②③④'[i]} ${o}`;
      b.addEventListener('click', () => answer(o, b));
      box.appendChild(b);
    });
  }
  function answer(o, btn) {
    const q = qs[qi];
    const ok = o === q.answer;
    const btns = [...$('qOpts').children];
    btns.forEach((b, i) => { b.disabled = true; if (q.options[i] === q.answer) b.classList.add('right'); });
    if (ok) {
      combo++; correct++; score += scoreFor(combo - 1); beep('ok');
      if (q.id) { state.lv = bumpLevel(state.lv, q.id, true); unmarkWrong(q.id); }
    } else {
      btn.classList.add('wrong'); combo = 0; beep('ng');
      missed.push(q);
      if (q.id) { state.lv = bumpLevel(state.lv, q.id, false); markWrong(q.id); }
    }
    save();
    const fb = $('qFb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.textContent = (ok ? '⭕ 정답! ' : `❌ 정답은 "${q.answer}" `) + '\n💡 ' + q.explain;
    fb.style.whiteSpace = 'pre-line';
    fb.hidden = false;
    $('qScore').textContent = `${score}점`;
    $('qCombo').textContent = combo >= 2 ? `🔥 ${combo}연속` : '';
    $('qNext').textContent = qi + 1 < qs.length ? '다음 ▶' : '결과 보기 🏁';
    $('qNext').hidden = false;
    $('qNext').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  $('qNext').addEventListener('click', () => {
    qi++;
    if (qi < qs.length) { renderQ(); scrollTo(0, 0); } else quizDone();
  });
  function quizDone() {
    $('quizPlay').hidden = true; $('quizDone').hidden = false;
    const st = starsFor(correct, qs.length);
    $('rStars').textContent = '★'.repeat(st) + '☆'.repeat(3 - st);
    $('rScore').textContent = `${score}점`;
    const isBest = score > state.best;
    if (isBest) state.best = score;
    save();
    $('rText').textContent = `${qs.length}문제 중 ${correct}개 정답` + (isBest ? ' · 🎉 최고 기록!' : '');
    const ul = $('rWrong'); ul.innerHTML = '';
    for (const q of missed) {
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = q.type === 'desc' ? q.text.split("'")[1] : q.answer;
      li.appendChild(b);
      li.appendChild(document.createTextNode(q.type === 'first' ? ` ← ${q.explain}` : ` — ${q.type === 'desc' ? q.answer : q.text}`));
      ul.appendChild(li);
    }
    if (st >= 2) beep('win');
  }
  $('quizAgain').addEventListener('click', startQuiz);

  // ── 연표 ──
  const TL_ROUNDS = 5;
  let tlRound = 0, tlScore = 0, tlEvents = [], tlPicked = [], tlMiss = false;
  function startTimeline() {
    tlRound = 0; tlScore = 0;
    $('tlPlay').hidden = false; $('tlDone').hidden = true;
    show('timeline');
    nextRound();
  }
  function nextRound() {
    tlEvents = pickEvents(eventsFor(sel()), 4);
    tlPicked = []; tlMiss = false;
    $('tlNum').textContent = `${tlRound + 1} / ${TL_ROUNDS}`;
    $('tlScore').textContent = `${tlScore}점`;
    $('tlFb').hidden = true; $('tlNext').hidden = true;
    const box = $('tlList'); box.innerHTML = '';
    for (const e of tlEvents) {
      const b = document.createElement('button');
      b.className = 'ev';
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="yr"></span>';
      b.querySelector('.t').textContent = e[3];
      b.addEventListener('click', () => tapEvent(e, b));
      box.appendChild(b);
    }
  }
  function tapEvent(e, b) {
    if (tlPicked.includes(e) || tlPicked.length === tlEvents.length) return;
    const remaining = tlEvents.filter((x) => !tlPicked.includes(x));
    const earliest = remaining.reduce((a, c) => (c[1] < a[1] ? c : a));
    if (e !== earliest) {
      tlMiss = true; beep('ng');
      b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
      return;
    }
    tlPicked.push(e); beep('ok');
    b.classList.add('picked');
    b.querySelector('.n').textContent = tlPicked.length;
    b.querySelector('.yr').textContent = e[2];
    if (tlPicked.length === tlEvents.length) {
      if (!tlMiss) tlScore++;
      const fb = $('tlFb');
      fb.className = 'feedback ' + (tlMiss ? 'ng' : 'ok');
      fb.textContent = tlMiss ? '조금 헷갈렸지만 완성! 연도를 다시 한번 봐 두세요.' : '⭕ 한 번에 완벽!';
      fb.hidden = false;
      $('tlScore').textContent = `${tlScore}점`;
      $('tlNext').textContent = tlRound + 1 < TL_ROUNDS ? '다음 ▶' : '결과 보기 🏁';
      $('tlNext').hidden = false;
    }
  }
  $('tlNext').addEventListener('click', () => {
    tlRound++;
    if (tlRound < TL_ROUNDS) nextRound();
    else {
      $('tlPlay').hidden = true; $('tlDone').hidden = false;
      const st = starsFor(tlScore, TL_ROUNDS);
      $('tlStars').textContent = '★'.repeat(st) + '☆'.repeat(3 - st);
      $('tlFinal').textContent = `${tlScore} / ${TL_ROUNDS}`;
      if (st >= 2) beep('win');
    }
  });
  $('tlAgain').addEventListener('click', startTimeline);

  show('home');

  // 설치 버튼 (Chrome/삼성 인터넷)
  let deferred = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; $('install').hidden = false; });
  $('install').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; $('install').hidden = true;
  });

  // 서비스 워커: 새 버전이 활성화되면 한 번 새로고침
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded || !navigator.serviceWorker.controller) return;
      reloaded = true; location.reload();
    });
  }
}
</script>
</body>
</html>
